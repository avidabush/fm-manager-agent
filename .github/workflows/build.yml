name: Build

# Every push and pull request: build the plugin and the installer, and run all tests.
# Publishing a release on GitHub (or pushing a tag like v0.3.0) also attaches
# ManagerAgent-Setup.exe and its checksums to that release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Mono (for .NET Framework reference assemblies) and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete zip

      - name: Build plugin + installer, run agent tests
        run: ./build-all.sh

      - name: Installer tests
        run: |
          dotnet build tests/SetupTests.csproj -c Release -o tests/bin -p:FrameworkPathOverride=/usr/lib/mono/4.7.2-api
          mono tests/bin/SetupTests.exe

      - name: Checksums
        run: cd dist && sha256sum ManagerAgent-Setup.exe ManagerAgent.dll | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ManagerAgent-${{ github.sha }}
          path: dist/

      - name: Attach installer to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/ManagerAgent-Setup.exe dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/ManagerAgent-Setup.exe dist/SHA256SUMS.txt \
              --title "Manager Agent ${TAG#v}" \
              --notes "Download **ManagerAgent-Setup.exe** and run it. Built automatically from this tag by GitHub Actions; checksums in SHA256SUMS.txt."
          fi
